server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    # Алиасы для статики из frontend/public, чтобы пути в HTML не править
    location /images/  { alias /var/www/html/upload/static/btk/images/;  expires 30d; add_header Cache-Control "public, immutable"; }
    location /icons/   { alias /var/www/html/upload/static/btk/icons/;   expires 30d; add_header Cache-Control "public, immutable"; }
    location /fonts/   { alias /var/www/html/upload/static/btk/fonts/;   expires 30d; add_header Cache-Control "public, immutable"; }
    location /video/   { alias /var/www/html/upload/static/btk/video/;   expires 30d; add_header Cache-Control "public"; }

    # Собранный фронт (style.css, main.js)
    location /upload/static/btk/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Битрикс upload (картинки инфоблоков)
    location /upload/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Запретить доступ к служебным файлам
    location ~ /\.(ht|env|git|docker) { deny all; }
    location ~ ^/(bitrix/php_interface|bitrix/modules)/ { deny all; }
    location ~ ^/local/php_interface/ { deny all; }

    # Битрикс urlrewrite
    location / {
        try_files $uri $uri/ @bitrix;
    }
    location @bitrix {
        rewrite ^(.*)$ /bitrix/urlrewrite.php last;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass btk_php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }
}
