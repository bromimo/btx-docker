services:
  web:
    build:
      context: ./.docker/nginx
    container_name: btk_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: ./.docker/php
    container_name: btk_php
    volumes:
      - ./:/var/www/html
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/bitrix.ini:ro
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-bitrix}
      DB_USER: ${DB_USER:-bitrix}
      DB_PASSWORD: ${DB_PASSWORD:-bitrix}
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-noreply@btk.local}
      SMARTCAPTCHA_SERVER_KEY: ${SMARTCAPTCHA_SERVER_KEY:-}
      SMARTCAPTCHA_CLIENT_KEY: ${SMARTCAPTCHA_CLIENT_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: btk_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --sql-mode=
      --innodb-strict-mode=OFF
      --default-time-zone=+03:00
      --max-allowed-packet=64M
      --innodb-buffer-pool-size=536870912
      --innodb-flush-log-at-trx-commit=2
      --innodb-log-buffer-size=16M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-bitrix}
      MYSQL_USER: ${DB_USER:-bitrix}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bitrix}
    volumes:
      - ./.docker/mysql/data:/var/lib/mysql
    ports:
      - "3307:3306"

  pma:
    image: phpmyadmin/phpmyadmin
    container_name: btk_pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 256M

  mail:
    image: maildev/maildev
    container_name: btk_mail
    restart: unless-stopped
    ports:
      - "1080:1080"
      - "1025:1025"
